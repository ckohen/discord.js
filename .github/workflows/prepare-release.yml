name: Prepare Release
run-name: ${{ inputs.request_id && format('[{0}] ', inputs.request_id) || '' }}Prepare release (${{ inputs.mode }}, ${{ inputs.dry_run && 'preview' || 'apply' }}) on ${{ inputs.branch || github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch (defaults to the branch running this workflow)'
        type: string
      request_id:
        description: 'Optional non-secret correlation ID for the Discord app'
        type: string
      mode:
        description: 'Detect changed packages or select packages explicitly'
        type: choice
        options: [auto, manual]
        default: auto
        required: true
      packages:
        description: 'Manual mode: folder or published names, e.g. builders,@discordjs/core,discord.js'
        type: string
      dry_run:
        description: 'Preview proposed bumps without changing the repository'
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: prepare-release-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release versions and changelogs
    if: github.repository_owner == 'discordjs'
    runs-on: ubuntu-latest
    steps:
      - name: Create release push token
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DISCORDJS_APP_ID }}
          private-key: ${{ secrets.DISCORDJS_APP_KEY_RELEASE }}
          permission-contents: write

      - name: Checkout target branch with release history
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.branch || github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Install Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Checkout workflow tools for a different target branch
        if: ${{ inputs.branch && inputs.branch != github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: workflow-source

      - name: Install workflow tools package manager
        if: ${{ inputs.branch && inputs.branch != github.ref_name }}
        uses: pnpm/action-setup@v6.0.9
        with:
          package_json_file: workflow-source/package.json

      - name: Install workflow tools dependencies
        if: ${{ inputs.branch && inputs.branch != github.ref_name }}
        working-directory: workflow-source
        run: pnpm install --filter @discordjs/actions --frozen-lockfile --ignore-scripts

      - name: Install target package manager
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false
          cache: true

      - name: Install target dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --loglevel error
        env:
          HUSKY: '0'

      - name: Prepare releases on a different target branch
        if: ${{ inputs.branch && inputs.branch != github.ref_name }}
        id: prepare-other
        uses: ./workflow-source/packages/actions/src/prepareRelease
        with:
          branch: ${{ inputs.branch }}
          mode: ${{ inputs.mode }}
          packages: ${{ inputs.packages }}
          dry: ${{ inputs.dry_run }}
          request_id: ${{ inputs.request_id }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_REPO: ${{ github.repository }}
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}

      - name: Prepare releases
        if: ${{ !inputs.branch || inputs.branch == github.ref_name }}
        id: prepare
        uses: ./packages/actions/src/prepareRelease
        with:
          branch: ${{ inputs.branch || github.ref_name }}
          mode: ${{ inputs.mode }}
          packages: ${{ inputs.packages }}
          dry: ${{ inputs.dry_run }}
          request_id: ${{ inputs.request_id }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_REPO: ${{ github.repository }}
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}

      - name: Upload release plan
        if: ${{ always() && (steps.prepare.outputs.plan-file || steps.prepare-other.outputs.plan-file) }}
        uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: ${{ steps.prepare.outputs.plan-file || steps.prepare-other.outputs.plan-file }}
